name: macOS build

# Builds GTUpl.app with PyInstaller on GitHub's macOS runners and attaches a
# .dmg per architecture to the release, under a fixed file name, so a link to
# .../releases/latest/download/GTUpl-mac-apple-silicon.dmg always points at the
# newest build. Also runs on demand (workflow_dispatch) to test a branch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Icon
        run: python packaging/make_icns.py

      - name: Build app bundle
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name GTUpl \
            --icon packaging/GTUpl.icns \
            --osx-bundle-identifier rent.gaytor.gtupl \
            --collect-data qtawesome \
            --hidden-import keyring.backends.macOS \
            gtupl.py

      - name: Disk image
        run: |
          hdiutil create -volname GTUpl -srcfolder dist/GTUpl.app -ov -format UDZO \
            "GTUpl-mac-${{ matrix.arch }}.dmg"
          ls -la *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: GTUpl-mac-${{ matrix.arch }}
          path: GTUpl-mac-${{ matrix.arch }}.dmg

      - name: Smoke test (starts and stays up without a display)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/GTUpl.app/Contents/MacOS/GTUpl &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            echo "GTUpl still running after 25 s"
            kill "$pid"
          else
            code=0; wait "$pid" || code=$?
            echo "GTUpl exited after start with code $code"
            cat "$HOME/Library/Application Support/GTUpl/logs/"*.log 2>/dev/null || true
            exit 1
          fi

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "GTUpl-mac-${{ matrix.arch }}.dmg" --clobber
