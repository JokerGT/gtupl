name: Windows build

# Builds GTUpl_Installer.exe the way _build.bat and _inno_installer.iss do on a
# developer machine: a Nuitka standalone build of gtupl.py with the flags from
# _build.bat (UPX included), packed by Inno Setup. Attaches the installer to
# every published release under its usual name, so a link to
# .../releases/latest/download/GTUpl_Installer.exe points at the newest build.
# Also runs on demand (workflow_dispatch), optionally without UPX to compare
# size and start time.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upx:
        description: "Compress with UPX, as _build.bat does"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      USE_UPX: ${{ github.event_name != 'workflow_dispatch' || inputs.upx }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka

      - name: Install UPX
        if: env.USE_UPX == 'true'
        run: choco install upx -y --no-progress

      - name: Build with Nuitka (flags from _build.bat)
        run: |
          $line = (Get-Content _build.bat | Where-Object { $_ -match 'nuitka' } | Select-Object -First 1).Trim()
          if ($line -notmatch '^python -m nuitka (.+) gtupl\.py$') { throw "Unexpected command in _build.bat: $line" }
          $flags = $Matches[1]
          if ($env:USE_UPX -ne 'true') { $flags = $flags -replace '\s*--(plugin-enable|enable-plugin)=upx', '' }
          $cmd = "python -m nuitka $flags --assume-yes-for-downloads gtupl.py"
          Write-Host $cmd
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Nuitka failed with exit code $LASTEXITCODE" }

      - name: Installer (Inno Setup)
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName _inno_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Sizes
        run: |
          $dist = (Get-ChildItem dist\gtupl.dist -Recurse -File | Measure-Object Length -Sum).Sum
          $setup = (Get-Item Output\GTUpl_Installer.exe).Length
          $text = "UPX: $env:USE_UPX | gtupl.dist: {0:N1} MB | GTUpl_Installer.exe: {1:N1} MB" -f ($dist / 1MB), ($setup / 1MB)
          Write-Host $text
          "### Windows build`n$text" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: GTUpl-windows${{ env.USE_UPX != 'true' && '-noupx' || '' }}
          path: Output/GTUpl_Installer.exe

      - name: Smoke test (starts and stays up without a display)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\gtupl.dist\gtupl.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "gtupl.exe exited after start with code $($p.ExitCode)"
            Get-ChildItem dist\gtupl.dist\logs -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }
          Write-Host "gtupl.exe still running after 25 s"
          Stop-Process -Id $p.Id -Force

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Output/GTUpl_Installer.exe --clobber
